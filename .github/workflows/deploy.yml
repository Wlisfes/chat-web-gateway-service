name: Build and deploy

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    build:
        name: Build and publish image
        runs-on: ubuntu-latest
        concurrency:
            group: build-${{ github.ref }}
            cancel-in-progress: true
        permissions:
            contents: read
            packages: write
        outputs:
            image: ${{ steps.image.outputs.name }}

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Resolve image name
              id: image
              shell: bash
              run: |
                  repository="ghcr.io/${GITHUB_REPOSITORY,,}"
                  echo "name=${repository}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
                  echo "latest=${repository}:latest" >> "$GITHUB_OUTPUT"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ steps.image.outputs.name }}
                      ${{ steps.image.outputs.latest }}
                  labels: |
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  secrets: |
                      github_token=${{ secrets.GITHUB_TOKEN }}

    deploy:
        name: Deploy to ${{ matrix.server }}
        needs: build
        strategy:
            fail-fast: false
            matrix:
                include:
                    - server: company
                      runner: chat-server-company
                      environment: production-company
                    - server: home
                      runner: chat-server-home
                      environment: production-home
        runs-on:
            - self-hosted
            - linux
            - ${{ matrix.runner }}
        environment: ${{ matrix.environment }}
        concurrency:
            group: deploy-${{ matrix.server }}
            cancel-in-progress: true
        permissions:
            contents: read
            packages: read
        env:
            DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/chat-web-gateway-service' }}
            IMAGE: ${{ needs.build.outputs.image }}

        steps:
            - name: Check out deployment files
              uses: actions/checkout@v4

            - name: Validate local Docker host
              shell: bash
              run: |
                  set -eu
                  [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "DEPLOY_PATH must be an absolute path" >&2; exit 1; }
                  command -v docker >/dev/null
                  export DOCKER_CONFIG="$RUNNER_TEMP/chat-web-gateway-service-docker-config"
                  printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG" >> "$GITHUB_ENV"
                  mkdir -p "$DOCKER_CONFIG"
                  chmod 700 "$DOCKER_CONFIG"
                  docker compose version
                  docker info >/dev/null
                  mkdir -p "$DEPLOY_PATH"
                  test -w "$DEPLOY_PATH" || { echo "$DEPLOY_PATH is not writable by the runner user" >&2; exit 1; }

            - name: Install deployment files
              shell: bash
              run: |
                  set -eu
                  install -m 0644 deploy/compose.yml "$DEPLOY_PATH/compose.yml"
                  install -m 0755 deploy/deploy.sh "$DEPLOY_PATH/deploy.sh"
                  install -m 0644 deploy/migrate-nacos-routes.cjs "$DEPLOY_PATH/migrate-nacos-routes.cjs"
                  install -m 0600 deploy/.env.example "$DEPLOY_PATH/.env.example"
                  if [ ! -f "$DEPLOY_PATH/.env" ]; then
                    install -m 0600 deploy/.env.example "$DEPLOY_PATH/.env"
                    echo "Initialized $DEPLOY_PATH/.env from deploy/.env.example"
                  fi

            - name: Migrate Nacos route prefixes
              shell: bash
              run: |
                  set -eu
                  network=$(sed -n 's/^DOCKER_NETWORK=//p' "$DEPLOY_PATH/.env" | tail -n 1 | tr -d '\r')
                  network=${network:-chat-web-infrastructure}
                  docker run --rm \
                    --network "$network" \
                    --env-file "$DEPLOY_PATH/.env" \
                    --env RUN_NACOS_ROUTE_MIGRATION=1 \
                    node:22-alpine node - < "$DEPLOY_PATH/migrate-nacos-routes.cjs"

            - name: Pull and deploy image
              shell: bash
              env:
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -eu
                  printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username '${{ github.actor }}' --password-stdin
                  cd "$DEPLOY_PATH"
                  ./deploy.sh "$IMAGE" compose.yml

            - name: Verify Finance route
              shell: bash
              run: |
                  set -eu
                  docker exec chat-web-gateway-service node -e '
                    require("http").get("http://127.0.0.1:3999/api/finance/health", response => {
                      let body = ""
                      response.setEncoding("utf8")
                      response.on("data", chunk => { body += chunk })
                      response.on("end", () => {
                        try { process.exit(JSON.parse(body).code === 200 ? 0 : 1) } catch { process.exit(1) }
                      })
                    }).on("error", () => process.exit(1))'

            - name: Log out from GitHub Container Registry
              if: always()
              shell: bash
              run: docker logout ghcr.io >/dev/null 2>&1 || true
