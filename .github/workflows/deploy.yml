name: Build and deploy

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    build:
        name: Build and publish image
        runs-on: ubuntu-latest
        concurrency:
            group: build-${{ github.ref }}
            cancel-in-progress: true
        permissions:
            contents: read
            packages: write
        outputs:
            image: ${{ steps.image.outputs.name }}

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Resolve image name
              id: image
              shell: bash
              run: |
                  repository="ghcr.io/${GITHUB_REPOSITORY,,}"
                  echo "name=${repository}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
                  echo "latest=${repository}:latest" >> "$GITHUB_OUTPUT"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ steps.image.outputs.name }}
                      ${{ steps.image.outputs.latest }}
                  labels: |
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  secrets: |
                      github_token=${{ secrets.GITHUB_TOKEN }}

    deploy:
        name: Deploy to chat-home-server
        needs: build
        runs-on:
            - self-hosted
            - linux
            - chat-home-server
        environment: production-home
        concurrency:
            group: deploy-chat-home-server
            cancel-in-progress: true
        permissions:
            contents: read
            packages: read
        env:
            DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/chat-web-gateway-service' }}
            DEPLOYMENT_ENVIRONMENT: production-home
            IMAGE: ${{ needs.build.outputs.image }}

        steps:
            - name: Check out deployment files
              uses: actions/checkout@v4

            - name: Validate local Docker host
              shell: bash
              run: |
                  set -eu
                  [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "DEPLOY_PATH must be an absolute path" >&2; exit 1; }
                  command -v docker >/dev/null
                  export DOCKER_CONFIG="$RUNNER_TEMP/chat-web-gateway-service-docker-config"
                  printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG" >> "$GITHUB_ENV"
                  mkdir -p "$DOCKER_CONFIG"
                  chmod 700 "$DOCKER_CONFIG"
                  docker compose version
                  docker info >/dev/null
                  mkdir -p "$DEPLOY_PATH"
                  test -w "$DEPLOY_PATH" || { echo "$DEPLOY_PATH is not writable by the runner user" >&2; exit 1; }

            - name: Install deployment files
              shell: bash
              run: |
                  set -eu
                  install -m 0644 deploy/compose.yml "$DEPLOY_PATH/compose.yml"
                  install -m 0755 deploy/deploy.sh "$DEPLOY_PATH/deploy.sh"
                  install -m 0644 deploy/migrate-nacos-routes.cjs "$DEPLOY_PATH/migrate-nacos-routes.cjs"
                  install -m 0600 deploy/.env.example "$DEPLOY_PATH/.env.example"
                  if [ ! -f "$DEPLOY_PATH/.env" ]; then
                    install -m 0600 deploy/.env.example "$DEPLOY_PATH/.env"
                    echo "Initialized $DEPLOY_PATH/.env from deploy/.env.example"
                  fi
                  test -r "$DEPLOY_PATH/.env" || {
                    echo "$DEPLOY_PATH/.env is not readable by the deployment runner" >&2
                    exit 1
                  }

            - name: 清理旧版 Nacos 启动覆盖项
              shell: bash
              run: |
                  set -eu
                  sed -i -E '/^NACOS_(REQUEST_TIMEOUT|REGISTER_PORT|REGISTER_IP|REGISTER_REQUIRED|GROUP|CONFIG_GROUP)=/d' "$DEPLOY_PATH/.env"

            - name: Migrate Nacos route prefixes
              shell: bash
              run: |
                  set -eu
                  network=$(sed -n 's/^DOCKER_NETWORK=//p' "$DEPLOY_PATH/.env" | tail -n 1 | tr -d '\r')
                  network=${network:-chat-web-infrastructure}
                  docker run --rm -i \
                    --network "$network" \
                    --env-file "$DEPLOY_PATH/.env" \
                    --env RUN_NACOS_ROUTE_MIGRATION=1 \
                    node:22-alpine node - < "$DEPLOY_PATH/migrate-nacos-routes.cjs"

            - name: Pull and deploy image
              shell: bash
              env:
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -eu
                  printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username '${{ github.actor }}' --password-stdin
                  cd "$DEPLOY_PATH"
                  ./deploy.sh "$IMAGE" compose.yml

            - name: 同步本机 web 网关入口
              shell: bash
              run: |
                  set -eu
                  nginx_container=chat-web-nginx
                  docker inspect "$nginx_container" >/dev/null
                  docker cp deploy/web-gateway-ingress.conf "$nginx_container:/etc/nginx/conf.d/web-gateway.conf"
                  docker cp deploy/dozzle-ingress.conf "$nginx_container:/etc/nginx/conf.d/dozzle.conf"
                  docker exec "$nginx_container" nginx -t
                  docker exec "$nginx_container" nginx -s reload

            - name: Verify service routes
              shell: bash
              run: |
                  set -eu
                  docker exec chat-web-gateway-service node -e '
                    const routes = [
                      { path: "/api/account/health", validate: body => body.code === 200 },
                      { path: "/api/finance/health", validate: body => body.code === 200 },
                      { path: "/api/crm/health", validate: body => body.code === 200 },
                      { path: "/api/skyline/health/live", validate: body => body.status === "UP" }
                    ]
                    const delay = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds))
                    async function waitForRoute(route) {
                      let lastError
                      for (let attempt = 1; attempt <= 120; attempt += 1) {
                        try {
                          const response = await fetch(`http://127.0.0.1:5000${route.path}`, { signal: AbortSignal.timeout(3000) })
                          const body = await response.json()
                          if (route.validate(body)) return
                          lastError = new Error(`${route.path} returned an unexpected response`)
                        } catch (error) {
                          lastError = error
                        }
                        await delay(5000)
                      }
                      throw lastError || new Error(`${route.path} did not become ready`)
                    }
                    Promise.all(routes.map(waitForRoute)).catch(error => { console.error(error.message); process.exit(1) })'

            - name: Log out from GitHub Container Registry
              if: always()
              shell: bash
              run: docker logout ghcr.io >/dev/null 2>&1 || true
