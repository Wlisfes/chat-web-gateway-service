name: chat-web-service

x-logging: &default-logging
    driver: json-file
    options:
        max-size: '20m'
        max-file: '5'

services:
    gateway-service:
        image: ${IMAGE:?IMAGE is required}
        container_name: chat-web-gateway-service
        restart: unless-stopped
        logging: *default-logging
        init: true
        env_file:
            - .env
        environment:
            NODE_ENV: production
            PORT: 3999
            TZ: ${TZ:-Asia/Shanghai}
            NACOS_REGISTER_PORT: ${NACOS_REGISTER_PORT:-3999}
        ports:
            - '${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-3999}:3999'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        networks:
            - infrastructure
        stop_grace_period: 20s

networks:
    infrastructure:
        external: true
        name: ${DOCKER_NETWORK:-chat-web-infrastructure}
