# 云端 chat-web.lisfes.cn 经 WireGuard 转发到本机 10.66.0.2:80；本机 Nginx 再转发到 Gateway。
server {
    listen 80;
    listen [::]:80;
    server_name chat-web.lisfes.cn;

    # Knife4j 会加载多个较大的 JS/CSS chunk。由本机 Nginx 在 WireGuard
    # 链路前压缩文本资源，避免首次打开文档页传输完整未压缩文件。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/ttf
        font/otf
        application/vnd.ms-fontobject
        application/font-woff
        application/font-woff2;

    # Knife4j 使用带 hash 的静态资源文件名，可以长期缓存；HTML 和 API
    # 文档仍保持动态，避免发布后读取旧配置。
    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp|woff|woff2|ttf|otf|eot)$ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $gateway_upstream chat-web-gateway-service:5000;
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering on;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control 'public, max-age=31536000, immutable' always;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $gateway_upstream chat-web-gateway-service:5000;
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
