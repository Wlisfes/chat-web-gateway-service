server {
    listen 80;
    listen [::]:80;
    server_name logs.lisfes.com;
    return 301 https://$host$request_uri;
}

# 云端 logs.lisfes.cn / chat-logs.lisfes.cn 通过 WireGuard 以 HTTP 转发到本机；这里不能再跳转
# HTTPS，否则会与云端 TLS 入口形成重定向循环。
server {
    listen 80;
    listen [::]:80;
    server_name logs.lisfes.cn chat-logs.lisfes.cn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/ttf
        font/otf
        application/vnd.ms-fontobject
        application/font-woff
        application/font-woff2;

    # Dozzle 静态资源带版本 hash，可以长期缓存并避免重复下载。
    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp|woff|woff2|ttf|otf|eot)$ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $dozzle_upstream chat-web-dozzle:8080;
        proxy_pass http://$dozzle_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering on;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control 'public, max-age=31536000, immutable' always;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $dozzle_upstream chat-web-dozzle:8080;
        proxy_pass http://$dozzle_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name logs.lisfes.com;

    ssl_certificate /etc/nginx/certs/lisfes.pem;
    ssl_certificate_key /etc/nginx/certs/lisfes-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $dozzle_upstream chat-web-dozzle:8080;
        proxy_pass http://$dozzle_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
