server:
    port: 3999

gateway:
    trustProxy: false
    proxy:
        timeoutMs: 30000
    rateLimit:
        max: 300
        windowMs: 60000
    cors:
        # 只填写完整 Origin，例如 https://admin.example.com；空数组表示不允许浏览器跨域访问。
        allowedOrigins: []
        credentials: false
    routes:
        - id: account
          prefix: /api/account
          serviceName: chat-web-account-service
          fallbackUrl: http://chat-web-account-service:3000
          enabled: true
        - id: finance
          prefix: /api/windows/finance
          serviceName: chat-web-finance-service
          fallbackUrl: http://chat-web-finance-service:3010
          enabled: true

nacos:
    discovery:
        enabled: true
        required: false
        group: DEFAULT_GROUP
    registration:
        enabled: true
        serviceName: chat-web-gateway-service
